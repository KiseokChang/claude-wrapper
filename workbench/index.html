<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>claude -p 워크벤치</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #1e293b; color: #fff; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  select, input, button { font-size: 13px; padding: 5px 8px; }
  #engineSel { background: #334155; color: #fff; border: 1px solid #475569; }
  label.chk { display: flex; align-items: center; gap: 4px; color: #cbd5e1; }
  #status { margin-left: auto; font-size: 12px; color: #94a3b8; }
  #status.busy { color: #fbbf24; }
  main { flex: 1; display: flex; min-height: 0; }
  #chatPane { flex: 1.4; display: flex; flex-direction: column; border-right: 1px solid #ccc; min-width: 0; }
  #rawPane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .paneTitle { padding: 6px 10px; background: #f1f5f9; font-size: 12px; color: #475569; border-bottom: 1px solid #e2e8f0; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  #raw { flex: 1; overflow-y: auto; padding: 8px 10px; font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: #0f172a; color: #94a3b8; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 90%; white-space: pre-wrap; }
  .user { background: #2563eb; color: #fff; margin-left: auto; }
  .assistant { background: #f1f5f9; }
  .thinking { color: #6b7280; font-size: 12px; padding: 4px 12px; font-style: italic; }
  .tool { font-family: Consolas, monospace; font-size: 12px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
  .tool.err { background: #fee2e2; border-color: #fca5a5; }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; }
  #choices { padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #choices button { background: #10b981; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #inputBar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ccc; }
  #input { flex: 1; resize: none; height: 60px; }
  #turnSummary { font-size: 11px; color: #64748b; padding: 2px 14px 6px; }
</style>
</head>
<body>
<header>
  <h1>claude -p 워크벤치</h1>
  <select id="engineSel" title="엔진 — 선택 즉시 저장되어 재기동 후에도 유지">
    <option value="DIRECT">claude 직접실행</option>
    <option value="OLLAMA">ollama launch claude</option>
  </select>
  <input id="ollamaModel" size="14" placeholder="kimi-k-code" style="display:none">
  <label class="chk"><input type="checkbox" id="skipPerm"> 권한 스킵 (무인)</label>
  <button id="resetBtn">세션 리셋</button>
  <span id="status">연결 중…</span>
</header>
<main>
  <div id="chatPane">
    <div class="paneTitle">대화</div>
    <div id="chat"></div>
    <div id="choices"></div>
    <div id="turnSummary"></div>
    <div id="inputBar">
      <textarea id="input" placeholder="메시지 입력 (Enter=전송, Shift+Enter=줄바꿈)"></textarea>
      <button id="sendBtn">전송</button>
    </div>
  </div>
  <div id="rawPane">
    <div class="paneTitle">raw stream-json (NDJSON)</div>
    <div id="raw"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let ws, currentAssistant = null, currentThinking = null;

function setStatus(t, busy) { $('status').textContent = t; $('status').className = busy ? 'busy' : ''; $('sendBtn').disabled = busy; }

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function addTool(name, input, isErr, content) {
  const d = document.createElement('div');
  d.className = 'tool' + (isErr ? ' err' : '');
  d.textContent = '⚙ ' + name;
  const pre = document.createElement('pre');
  pre.textContent = content !== undefined ? content : JSON.stringify(input, null, 1);
  if (content === undefined) d.textContent += ' ' + JSON.stringify(input, null, 1);
  else d.appendChild(pre);
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function showChoices(list) {
  $('choices').innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => { $('choices').innerHTML = ''; ws.send(JSON.stringify({action: 'send', text: c})); addMsg('user', c); };
    $('choices').appendChild(b);
  });
}

function handle(ev) {
  $('raw').textContent += JSON.stringify(ev) + '\n';
  $('raw').scrollTop = $('raw').scrollHeight;
  const d = ev.data || {};
  switch (ev.event) {
    case 'config':
      $('engineSel').value = d.engine;
      $('ollamaModel').style.display = d.engine === 'OLLAMA' ? '' : 'none';
      $('ollamaModel').value = d.ollama_model;
      setStatus('연결됨 — 엔진: ' + d.engine);
      break;
    case 'text_delta':
      if (!currentAssistant) currentAssistant = addMsg('assistant', '');
      currentAssistant.textContent += d.text;
      $('chat').scrollTop = $('chat').scrollHeight;
      break;
    case 'thinking_delta':
      if (!currentThinking) currentThinking = document.createElement('div');
      currentThinking.className = 'thinking';
      if (!currentThinking.isConnected) $('chat').appendChild(currentThinking);
      currentThinking.textContent += d.thinking;
      $('chat').scrollTop = $('chat').scrollHeight;
      break;
    case 'assistant_text':
      currentAssistant = null;
      break;
    case 'tool_use':
      currentAssistant = currentThinking = null;
      addTool(d.name, d.input, false);
      break;
    case 'tool_result':
      addTool('결과', d, d.is_error, d.content);
      currentAssistant = currentThinking = null;
      break;
    case 'result': currentAssistant = currentThinking = null; break;
    case 'turn_done':
      currentAssistant = currentThinking = null;
      $('turnSummary').textContent =
        `턴 완료 — ${d.is_error ? '오류' : '성공'} · $${d.cost_usd} · ${(d.duration_ms/1000).toFixed(1)}s · sid=${(d.session_id||'').slice(0,8)}`;
      setStatus('연결됨', false);
      break;
    case 'proc_error':
      addTool('프로세스 오류', d, true, d);
      setStatus('연결됨', false);
      break;
    case 'reset':
      $('chat').innerHTML = ''; $('raw').textContent = ''; $('turnSummary').textContent = '';
      addMsg('assistant', '(세션 리셋됨 — 새 세션 시작)');
      break;
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setStatus('연결됨');
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setStatus('연결 끊김 — 2초 후 재시도');
}

function send() {
  const t = $('input').value.trim();
  if (!t) return;
  $('input').value = '';
  currentAssistant = currentThinking = null;
  addMsg('user', t);
  ws.send(JSON.stringify({action: 'send', text: t}));
  setStatus('실행 중…', true);
}
$('sendBtn').onclick = send;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('resetBtn').onclick = () => ws.send(JSON.stringify({action: 'reset'}));
$('skipPerm').onchange = () => ws.send(JSON.stringify({action: 'set_mode', skip_permissions: $('skipPerm').checked}));
$('engineSel').onchange = () => {
  const eng = $('engineSel').value;
  $('ollamaModel').style.display = eng === 'OLLAMA' ? '' : 'none';
  ws.send(JSON.stringify({action: 'set_engine', engine: eng, ollama_model: $('ollamaModel').value}));
};
$('ollamaModel').onchange = () => ws.send(JSON.stringify({action: 'set_engine', engine: 'OLLAMA', ollama_model: $('ollamaModel').value}));

connect();
</script>
</body>
</html>
