<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>claude -p 워크벤치</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #1e293b; color: #fff; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  select, input, button { font-size: 13px; padding: 5px 8px; }
  #engineSel { background: #334155; color: #fff; border: 1px solid #475569; }
  label.chk { display: flex; align-items: center; gap: 4px; color: #cbd5e1; }
  #status { margin-left: auto; font-size: 12px; color: #94a3b8; }
  #status.busy { color: #fbbf24; }
  main { flex: 1; display: flex; min-height: 0; }
  #chatPane { flex: 1.4; display: flex; flex-direction: column; border-right: 1px solid #ccc; min-width: 0; }
  #rawPane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .paneTitle { padding: 6px 10px; background: #f1f5f9; font-size: 12px; color: #475569; border-bottom: 1px solid #e2e8f0; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  #raw { flex: 1; overflow-y: auto; padding: 8px 10px; font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: #0f172a; color: #94a3b8; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 90%; white-space: pre-wrap; }
  .user { background: #2563eb; color: #fff; margin-left: auto; }
  .assistant { background: #f1f5f9; }
  details.thinking { color: #6b7280; font-size: 12px; padding: 4px 12px; font-style: italic; max-width: 90%; }
  details.thinking summary { cursor: pointer; }
  details.thinking .thinkingBody { white-space: pre-wrap; margin-top: 4px; }
  .tool { font-family: Consolas, monospace; font-size: 12px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
  .tool.err { background: #fee2e2; border-color: #fca5a5; }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; }
  #choices { padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #choices button { background: #10b981; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #inputBar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ccc; }
  #input { flex: 1; resize: none; height: 60px; }
  #turnSummary { font-size: 11px; color: #64748b; padding: 2px 14px 6px; }
  .tab { border: 1px solid #cbd5e1; background: #fff; color: #475569; cursor: pointer; border-radius: 4px; font-size: 11px; padding: 2px 8px; }
  .tab.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  #fileView { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 12px; display: none; }
  .frow { padding: 3px 4px; cursor: pointer; border-radius: 4px; }
  .frow:hover { background: #f1f5f9; }
  #fcrumb { margin-bottom: 6px; color: #475569; }
  #fcrumb .frow { display: inline; }
  #fileContent { font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; margin: 0; }
  #history { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #history .panel { background: #fff; width: min(560px, 90vw); max-height: 80vh; overflow-y: auto; border-radius: 10px; padding: 14px; }
  #history .row { border-bottom: 1px solid #e2e8f0; padding: 8px 6px; cursor: pointer; }
  #history .row:hover { background: #f1f5f9; }
  #history .meta { font-size: 11px; color: #64748b; margin-top: 2px; }
  .turnDiv { font-size: 11px; color: #2563eb; margin: 10px 0 2px; border-bottom: 1px dashed #bfdbfe; padding-bottom: 2px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>claude -p 워크벤치</h1>
  <select id="engineSel" title="엔진 — 선택 즉시 저장되어 재기동 후에도 유지">
    <option value="DIRECT">claude 직접실행</option>
    <option value="OLLAMA">ollama launch claude</option>
  </select>
  <input id="ollamaModel" size="14" placeholder="kimi-k-code" style="display:none">
  <label class="chk"><input type="checkbox" id="skipPerm"> 권한 스킵 (무인)</label>
  <button id="resetBtn">세션 리셋</button>
  <button id="histBtn">📜 이력</button>
  <span id="status">연결 중…</span>
  <span id="costBadge" style="font-size:12px; color:#a5b4fc;"></span>
</header>
<div id="history">
  <div class="panel">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <b>세션 이력</b><button id="histClose">닫기</button>
    </div>
    <div id="histList"></div>
  </div>
</div>
<main>
  <div id="chatPane">
    <div class="paneTitle">대화</div>
    <div id="chat"></div>
    <div id="choices"></div>
    <div id="turnSummary"></div>
    <div id="inputBar">
      <textarea id="input" placeholder="메시지 입력 (Enter=전송, Shift+Enter=줄바꿈)"></textarea>
      <button id="sendBtn">전송</button>
    </div>
  </div>
  <div id="rawPane">
    <div class="paneTitle" style="display:flex; gap:6px; align-items:center;">
      <button class="tab on" id="tabRaw">raw stream-json</button>
      <button class="tab" id="tabFiles">📁 파일</button>
    </div>
    <div id="raw"></div>
    <div id="fileView">
      <div id="fcrumb"></div>
      <div id="flist"></div>
      <pre id="fileContent" style="display:none;"></pre>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let ws, currentAssistant = null, currentThinking = null;

// thinking 블록 접기 — 텍스트/툴 이벤트가 오면 자동 접고, 클릭으로 토글
function collapseThinking() {
  if (currentThinking && currentThinking.isConnected) {
    currentThinking.open = false;
    currentThinking.querySelector('summary').textContent = '💭 생각 (클릭해서 보기)';
  }
  currentThinking = null;
}
let totalCost = 0, lastUsage = null;

function renderCost() {
  let t = `누적 $${totalCost.toFixed(2)}`;
  if (lastUsage) {
    const inK = (lastUsage.input_tokens / 1000).toFixed(1);
    const outK = (lastUsage.output_tokens / 1000).toFixed(1);
    const cache = lastUsage.input_tokens
      ? Math.round(lastUsage.cache_read_input_tokens / lastUsage.input_tokens * 100) : 0;
    t += ` · in ${inK}k/out ${outK}k · 캐시 ${cache}%`;
  }
  $('costBadge').textContent = t;
}

function setStatus(t, busy) { $('status').textContent = t; $('status').className = busy ? 'busy' : ''; $('sendBtn').disabled = busy; }

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function addTool(name, input, isErr, content) {
  const d = document.createElement('div');
  d.className = 'tool' + (isErr ? ' err' : '');
  d.textContent = '⚙ ' + name;
  const pre = document.createElement('pre');
  pre.textContent = content !== undefined ? content : JSON.stringify(input, null, 1);
  if (content === undefined) d.textContent += ' ' + JSON.stringify(input, null, 1);
  else d.appendChild(pre);
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function showChoices(list) {
  $('choices').innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => { $('choices').innerHTML = ''; ws.send(JSON.stringify({action: 'send', text: c})); addMsg('user', c); };
    $('choices').appendChild(b);
  });
}

function handle(ev) {
  $('raw').textContent += JSON.stringify(ev) + '\n';
  $('raw').scrollTop = $('raw').scrollHeight;
  const d = ev.data || {};
  switch (ev.event) {
    case 'config':
      $('engineSel').value = d.engine;
      $('ollamaModel').style.display = d.engine === 'OLLAMA' ? '' : 'none';
      $('ollamaModel').value = d.ollama_model;
      setStatus('연결됨 — 엔진: ' + d.engine);
      break;
    case 'text_delta':
      collapseThinking();
      if (!currentAssistant) currentAssistant = addMsg('assistant', '');
      currentAssistant.textContent += d.text;
      $('chat').scrollTop = $('chat').scrollHeight;
      break;
    case 'thinking_delta': {
      if (!currentThinking) {
        currentThinking = document.createElement('details');
        currentThinking.open = true;
        const sum = document.createElement('summary');
        sum.textContent = '💭 생각 중…';
        sum.onclick = () => setTimeout(() => {
          sum.textContent = currentThinking.open ? '💭 생각' : '💭 생각 (클릭해서 보기)';
        }, 0);
        currentThinking.appendChild(sum);
        const body = document.createElement('div');
        body.className = 'thinkingBody';
        currentThinking.appendChild(body);
        $('chat').appendChild(currentThinking);
      }
      currentThinking.querySelector('.thinkingBody').textContent += d.thinking;
      $('chat').scrollTop = $('chat').scrollHeight;
      break;
    }
    case 'assistant_text':
      collapseThinking();
      currentAssistant = null;
      break;
    case 'tool_use':
      collapseThinking();
      currentAssistant = null;
      addTool(d.name, d.input, false);
      break;
    case 'permission_denied': {
      collapseThinking();
      currentAssistant = null;
      const card = addTool('🚫 ' + d.tool_name + ' 권한 거부', d, true, d.message);
      const retry = document.createElement('button');
      retry.textContent = '🔓 권한 스킵 후 재시도';
      retry.style.cssText = 'margin:6px 4px 0 0; padding:4px 10px; cursor:pointer;';
      retry.onclick = () => {
        retry.disabled = true;
        $('skipPerm').checked = true;
        ws.send(JSON.stringify({action: 'set_mode', skip_permissions: true}));
        const t = '아까 거부된 ' + d.tool_name + ' 작업을 이어서 진행해줘';
        currentAssistant = currentThinking = null;
        addMsg('user', t);
        ws.send(JSON.stringify({action: 'send', text: t, skip_permissions: true}));
        setStatus('실행 중…', true);
      };
      card.appendChild(retry);
      break;
    }
    case 'tool_result':
      collapseThinking();
      currentAssistant = null;
      addTool('결과', d, d.is_error, d.content);
      break;
    case 'result':
      collapseThinking();
      currentAssistant = null;
      if (d.total_cost_usd) { totalCost += d.total_cost_usd; renderCost(); }
      if (d.usage) { lastUsage = d.usage; renderCost(); }
      break;
    case 'session_loaded': {
      currentAssistant = currentThinking = null;
      $('chat').innerHTML = ''; $('raw').textContent = ''; $('turnSummary').textContent = '';
      const head = document.createElement('div');
      head.className = 'turnDiv';
      head.textContent = '📜 이력 불러옴 — sid=' + (d.sid || '').slice(0, 8) + ' · 이어서 입력하면 이 세션을 이어갑니다';
      $('chat').appendChild(head);
      totalCost = 0;
      (d.turns || []).forEach(rec => {
        totalCost += rec.cost_usd || 0;
        const div = document.createElement('div');
        div.className = 'turnDiv';
        div.textContent = '▶ ' + (rec.prompt || '') + '  · $' + (rec.cost_usd || 0).toFixed(3) + ' · ' + (rec.ts || '');
        $('chat').appendChild(div);
        (rec.events || []).forEach(ev => {
          const e = ev.data || {};
          if (ev.event === 'assistant_text') addMsg('assistant', e.text);
          else if (ev.event === 'tool_use') addTool(e.name, e.input, false);
          else if (ev.event === 'tool_result') addTool('결과', e, e.is_error, e.content);
          else if (ev.event === 'permission_denied') addTool('🚫 ' + e.tool_name + ' 권한 거부', e, true, e.message);
        });
      });
      renderCost();
      setStatus('연결됨', false);
      break;
    }
    case 'turn_done':
      collapseThinking();
      currentAssistant = null;
      $('turnSummary').textContent =
        `턴 완료 — ${d.is_error ? '오류' : '성공'} · $${d.cost_usd} · ${(d.duration_ms/1000).toFixed(1)}s · sid=${(d.session_id||'').slice(0,8)}`;
      setStatus('연결됨', false);
      break;
    case 'proc_error':
      addTool('프로세스 오류', d, true, d);
      setStatus('연결됨', false);
      break;
    case 'reset':
      $('chat').innerHTML = ''; $('raw').textContent = ''; $('turnSummary').textContent = '';
      totalCost = 0; lastUsage = null; renderCost();
      addMsg('assistant', '(세션 리셋됨 — 새 세션 시작)');
      break;
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setStatus('연결됨');
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setStatus('연결 끊김 — 2초 후 재시도');
}

function send() {
  const t = $('input').value.trim();
  if (!t) return;
  $('input').value = '';
  currentAssistant = currentThinking = null;
  addMsg('user', t);
  ws.send(JSON.stringify({action: 'send', text: t}));
  setStatus('실행 중…', true);
}
$('sendBtn').onclick = send;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('resetBtn').onclick = () => ws.send(JSON.stringify({action: 'reset'}));
$('histBtn').onclick = async () => {
  const p = $('history');
  if (p.style.display === 'flex') { p.style.display = 'none'; return; }
  const list = await (await fetch('/api/sessions')).json();
  const box = $('histList'); box.innerHTML = '';
  if (!list.length) {
    const e = document.createElement('div');
    e.style.cssText = 'padding:8px; color:#94a3b8; font-size:12px;';
    e.textContent = '저장된 세션이 없습니다 — 대화를 시작하면 턴 단위로 자동 기록됩니다';
    box.appendChild(e);
  }
  list.forEach(s => {
    const r = document.createElement('div'); r.className = 'row';
    const t = document.createElement('div'); t.textContent = s.first_prompt || '(제목 없음)';
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = (s.sid || '').slice(0, 8) + ' · ' + s.turns + '턴 · $' + (s.total_cost || 0).toFixed(3) +
                    ' · ' + (s.last_ts || '').replace('T', ' ');
    r.appendChild(t); r.appendChild(m);
    r.onclick = () => { p.style.display = 'none'; ws.send(JSON.stringify({action: 'load_session', sid: s.sid})); };
    box.appendChild(r);
  });
  p.style.display = 'flex';
};
$('histClose').onclick = () => { $('history').style.display = 'none'; };

// ---------- 파일 브라우저 ----------
let fileDir = '';
function showTab(which) {
  $('tabRaw').className = 'tab' + (which === 'raw' ? ' on' : '');
  $('tabFiles').className = 'tab' + (which === 'files' ? ' on' : '');
  $('raw').style.display = which === 'raw' ? '' : 'none';
  $('fileView').style.display = which === 'files' ? 'block' : 'none';
  if (which === 'files') openDir(fileDir);
}
async function openDir(path) {
  fileDir = path;
  const list = await (await fetch('/api/files?dir=' + encodeURIComponent(path))).json();
  if (!Array.isArray(list)) { $('flist').textContent = '경로 오류'; return; }
  $('fileContent').style.display = 'none';
  $('flist').style.display = '';
  const crumb = $('fcrumb');
  crumb.textContent = '';
  const rootLink = document.createElement('span');
  rootLink.className = 'frow';
  rootLink.textContent = '📁 workspace';
  rootLink.onclick = () => openDir('');
  crumb.appendChild(rootLink);
  let acc = '';
  (path ? path.split('/') : []).forEach(seg => {
    acc += (acc ? '/' : '') + seg;
    const s = document.createElement('span');
    s.className = 'frow';
    s.textContent = ' / ' + seg;
    s.onclick = () => openDir(acc);
    crumb.appendChild(s);
  });
  const box = $('flist');
  box.innerHTML = '';
  if (path) {
    const up = document.createElement('div');
    up.className = 'frow';
    up.textContent = '↩ 상위로';
    up.onclick = () => openDir(path.split('/').slice(0, -1).join('/'));
    box.appendChild(up);
  }
  list.forEach(e => {
    const r = document.createElement('div');
    r.className = 'frow';
    r.textContent = (e.type === 'dir' ? '📁 ' : '📄 ') + e.name +
                    (e.type === 'file' ? '  (' + e.size + 'B)' : '');
    r.onclick = () => {
      if (e.type === 'dir') openDir((path ? path + '/' : '') + e.name);
      else openFile((path ? path + '/' : '') + e.name);
    };
    box.appendChild(r);
  });
}
async function openFile(path) {
  const d = await (await fetch('/api/file?path=' + encodeURIComponent(path))).json();
  if (d.error) return;
  $('flist').style.display = 'none';
  const pre = $('fileContent');
  pre.style.display = '';
  pre.textContent = d.content + (d.truncated ? '\n… (잘림 — 전체 ' + d.size + 'B)' : '');
  const crumb = $('fcrumb');
  crumb.textContent = '';
  const back = document.createElement('span');
  back.className = 'frow';
  back.textContent = '↩ 목록';
  back.onclick = () => openDir(fileDir);
  crumb.appendChild(back);
}
$('tabRaw').onclick = () => showTab('raw');
$('tabFiles').onclick = () => showTab('files');
$('skipPerm').onchange = () => ws.send(JSON.stringify({action: 'set_mode', skip_permissions: $('skipPerm').checked}));
$('engineSel').onchange = () => {
  const eng = $('engineSel').value;
  $('ollamaModel').style.display = eng === 'OLLAMA' ? '' : 'none';
  ws.send(JSON.stringify({action: 'set_engine', engine: eng, ollama_model: $('ollamaModel').value}));
};
$('ollamaModel').onchange = () => ws.send(JSON.stringify({action: 'set_engine', engine: 'OLLAMA', ollama_model: $('ollamaModel').value}));

connect();
</script>
</body>
</html>
